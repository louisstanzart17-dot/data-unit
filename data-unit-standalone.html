<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Unit Dealer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1F3D; --navy-2:#1B2F57; --navy-3:#2A4275;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB;
  --ink:#16213A; --muted:#5E6A7F; --line:#E1E5EC; --line-2:#CDD3DE;
  --accent:#E3A82B; --accent-hover:#D19818; --accent-ink:#1A1405; --accent-soft:#FCF3DF;
  --danger:#B8332B; --danger-soft:#FBEAE8; --success:#1D7F55; --success-soft:#E4F4EC;
  --side-ink:#C9D3E6; --focus:#3A6FD8;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 4px 16px rgba(15,31,61,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1830; --surface:#15213D; --surface-2:#1A2848; --ink:#E5EAF3; --muted:#9BA7BE;
  --line:#253659; --line-2:#33497A; --accent-soft:#3A3013; --danger-soft:#3A1D1E; --success-soft:#15352A;
  --navy:#0A1328; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0E1830; --surface:#15213D; --surface-2:#1A2848; --ink:#E5EAF3; --muted:#9BA7BE;
  --line:#253659; --line-2:#33497A; --accent-soft:#3A3013; --danger-soft:#3A1D1E; --success-soft:#15352A;
  --navy:#0A1328; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand small{font-size:12px;color:#8C9AB6}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r-md);color:var(--side-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:12px;color:#8C9AB6;font-variant-numeric:tabular-nums}
.sync{margin-top:auto;font-size:12.5px;line-height:1.45;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.05);display:flex;gap:10px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#7C8AA5;margin-top:6px;flex:none}
.sync[data-s="cloud"] .dot{background:#4CC38A}
.sync[data-s="local"] .dot{background:var(--accent)}
.sync[data-s="loading"] .dot,.sync[data-s="syncing"] .dot{animation:pulse 1.2s infinite}
.sync b{color:#fff;font-weight:600;display:block}
@keyframes pulse{50%{opacity:.3}}

.main{padding:28px 32px 48px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.93)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:34px;height:34px;padding:0}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md);margin-left:0}
.btn-group .btn:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* card / summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.summary{display:flex;gap:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.summary div{padding:16px 22px;border-right:1px solid var(--line);min-width:160px}
.summary div:last-child{border-right:0}
.summary span{display:block;font-size:12.5px;color:var(--muted)}
.summary strong{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.summary .neg{color:var(--danger)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px 18px;align-items:center}
.toolbar+.toolbar{padding-top:0}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.field-ctl,.toolbar select{height:38px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);padding:0 11px;width:100%}
.toolbar select{width:auto;max-width:190px;padding-right:28px}
.field-ctl:hover,.toolbar select:hover{border-color:var(--muted)}
.field-ctl:focus,.toolbar select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.spacer{flex:1}
.meta{color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}

/* table */
.tablewrap{overflow:auto;max-height:calc(100vh - 330px);min-height:280px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted)}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--focus)}
th .arr{font-size:10px;opacity:.35}
th[aria-sort] .arr{opacity:1;color:var(--ink)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.name{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
td.neg{color:var(--danger)}
td.muted{color:var(--muted)}
td.act{text-align:right;padding:6px 10px;width:1%;position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
th:last-child{position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 var(--line)}
td.act .btn{color:var(--muted)}
td.act .btn:hover{color:var(--ink)}
td.act .btn.del:hover{color:var(--danger);background:var(--danger-soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.badge.stok{background:var(--accent-soft);color:#8A5F06}
.badge.terjual{background:var(--success-soft);color:var(--success)}
:root[data-theme="dark"] .badge.stok{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.stok{color:var(--accent)}}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:16px}
.empty p{margin:0 auto 16px;max-width:420px}

.pager{display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
.pages{display:flex;gap:4px;margin-left:auto;align-items:center}
.pages .btn{min-width:34px;height:34px;padding:0 8px}
.pages .btn[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pages .gap{padding:0 4px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,19,40,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 32px rgba(10,19,40,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.d-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.d-foot{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.d-foot .hint{margin-right:auto;font-size:12.5px;color:var(--muted)}
.sec{padding:18px 0 6px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 14px;font-size:14px;font-weight:700;color:var(--navy-3)}
:root[data-theme="dark"] .sec h3{color:#9DB5E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec h3{color:#9DB5E8}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.f label .req{color:var(--danger);margin-left:2px}
.f .wrap{position:relative;display:flex;align-items:center}
.f .pre,.f .suf{position:absolute;font-size:13px;color:var(--muted);pointer-events:none}
.f .pre{left:11px}.f .suf{right:11px}
.f .wrap .field-ctl.has-pre{padding-left:34px}
.f .wrap .field-ctl.has-suf{padding-right:52px}
.f .money{text-align:right;font-variant-numeric:tabular-nums}
.f textarea.field-ctl{height:auto;min-height:64px;padding:9px 11px;resize:vertical}
.f .err{font-size:12.5px;color:var(--danger);display:none}
.f.invalid .field-ctl{border-color:var(--danger)}
.f.invalid .err{display:block}
.calc{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px dashed var(--line-2);font-weight:600;font-variant-numeric:tabular-nums}
.calc small{font-weight:400;color:var(--muted);font-size:12px}
.calc.neg b{color:var(--danger)}
.calc.big{background:var(--accent-soft);border-style:solid;border-color:transparent}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .box{width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:0 20px 60px rgba(10,19,40,.3);opacity:0;transform:translateY(8px) scale(.99);transition:.18s;pointer-events:none}
.modal.open .box{opacity:1;transform:none;pointer-events:auto}
.modal.sm .box{width:min(440px,100%)}
.m-body{overflow:auto;padding:4px 24px 20px}
.m-body p{margin:0 0 6px;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;color:var(--muted)}
.dl dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.dl dd.neg{color:var(--danger)}
.dl dd.empty-v{color:var(--line-2)}

/* toast */
.toasts{position:fixed;right:20px;top:calc(16px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--navy);color:#fff;box-shadow:0 8px 28px rgba(10,19,40,.28);
  font-size:13.5px;animation:tin .2s ease}
.toast .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.toast.success .ic{background:#2FA56E}.toast.error .ic{background:var(--danger)}.toast.info .ic{background:var(--navy-3)}
.toast .ic svg{width:13px;height:13px;stroke-width:2.6}
.toast b{display:block;font-weight:600}
.toast span{color:#C3CDE0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;z-index:20;top:0}
  .brand small,.sync{display:none}
  .brand-mark{width:32px;height:32px}
  .nav{flex-direction:row;margin-left:auto}
  .nav button{padding:8px 11px}
  .nav .count{display:none}
  .nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .main{padding:20px 16px 40px}
  .tablewrap{max-height:none}
}
@media (max-width:620px){
  .brand b{display:none}
  .grid,.dl{grid-template-columns:1fr}
  .top h1{font-size:20px}
  .top .btn.primary{width:100%}
  .summary div{flex:1 1 50%;padding:12px 16px}
  .summary div:nth-child(2){border-right:0}
  .summary strong{font-size:16px}
  .search{max-width:none;flex-basis:100%}
  .toolbar select{flex:1 1 40%;max-width:none}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .d-foot .hint{display:none}
  .d-foot .btn{flex:1}
  .pages{margin-left:0;width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">DU</div><div><b>Data Unit</b><small>Administrasi dealer</small></div></div>
    <nav class="nav" aria-label="Modul data">
      <button data-mod="baru" aria-current="true"><span>Unit baru</span><span class="count" id="cnt-baru">–</span></button>
      <button data-mod="mokas"><span>Unit mokas</span><span class="count" id="cnt-mokas">–</span></button>
    </nav>
    <div class="sync" id="sync" data-s="loading"><span class="dot"></span><div id="syncText"><b>Menghubungkan…</b>Menyiapkan penyimpanan data</div></div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="title">Unit baru</h1><p id="subtitle"></p></div>
      <button class="btn primary" id="btnAdd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah data</button>
    </header>

    <section class="card">
      <div class="summary" id="summary"></div>
      <div class="toolbar">
        <label class="search"><span class="sr">Cari data</span>
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="field-ctl" id="q" type="search" placeholder="Cari nama, no. HP, tipe, no. polisi…" autocomplete="off">
        </label>
        <div id="filters" style="display:contents"></div>
        <select id="sort" aria-label="Urutkan"></select>
      </div>
      <div class="toolbar">
        <span class="meta" id="meta"></span>
        <span class="spacer"></span>
        <button class="btn sm ghost" id="btnReset" hidden>Reset filter</button>
        <button class="btn sm" id="btnRefresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Muat ulang</button>
        <button class="btn sm" id="btnImport"><svg class="i" viewBox="0 0 24 24"><path d="M12 20V9m-5 5 5-5 5 5M5 4h14"/></svg>Import Excel</button>
        <div class="btn-group" role="group" aria-label="Export">
          <button class="btn sm" data-export="xlsx"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>Excel</button>
          <button class="btn sm" data-export="csv">CSV</button>
          <button class="btn sm" data-export="pdf">PDF</button>
        </div>
      </div>
      <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="emptyBox"></div></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="d-head"><div><h2 id="dTitle">Tambah data</h2><p id="dSub"></p></div>
    <button class="btn icon ghost" data-close aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <form class="d-body" id="form" novalidate></form>
  <div class="d-foot"><span class="hint">Kolom bertanda <span style="color:var(--danger)">*</span> wajib diisi</span>
    <button class="btn" data-close type="button">Batal</button>
    <button class="btn primary" id="btnSave" type="button">Simpan data</button></div>
</aside>

<div class="modal" id="detail" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box">
  <div class="d-head"><div><h2 id="mTitle"></h2><p id="mSub"></p></div>
    <button class="btn icon ghost" data-mclose aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="m-body" id="mBody"></div>
  <div class="d-foot"><button class="btn" id="mDel" style="margin-right:auto;color:var(--danger)">Hapus</button>
    <button class="btn" data-mclose>Tutup</button><button class="btn primary" id="mEdit">Edit data</button></div>
</div></div>

<div class="modal sm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cTitle"><div class="box">
  <div class="d-head"><h2 id="cTitle"></h2></div>
  <div class="m-body" style="padding-top:16px"><p id="cBody"></p></div>
  <div class="d-foot"><button class="btn" id="cNo" style="margin-left:auto">Batal</button><button class="btn" id="cYes"></button></div>
</div></div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file" accept=".xlsx,.xls" hidden>
<datalist id="dl-empty"></datalist>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('id-ID');
const fmtRp = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : (n < 0 ? '−Rp ' : 'Rp ') + Math.abs(n).toLocaleString('id-ID');
const fmtDate = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}); };
const fmtDateLong = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}); };

for (const m of Object.values(MODS)) { m.byKey = {}; m.fields.forEach(f => { f.h = f.h || f.l; m.byKey[f.k] = f; }); }

const state = {

function prepare(mod, rec) {
  const m = MODS[mod];

}
function setData(mod, arr) {

}

/* ---------- storage: cloud db, fallback browser ---------- */
const DB_ERR = {
  quota_exceeded: 'Kapasitas penyimpanan penuh (maks. 5.000 data). Hapus atau export data lama terlebih dulu.',
  resource_exhausted: 'Terlalu banyak permintaan dalam waktu singkat. Tunggu beberapa detik lalu coba lagi.',
  invalid_argument: 'Anda tidak memiliki izin mengubah data ini, atau isian tidak valid.',
  revoked: 'Akses ke penyimpanan dicabut. Muat ulang halaman.',
  unavailable: 'Server penyimpanan sedang tidak dapat dijangkau. Periksa koneksi lalu coba lagi.',
  local_quota: 'Penyimpanan browser penuh. Export data lalu hapus sebagian data lama.'
};
const errMsg = e => DB_ERR[e?.code] || e?.message || 'Terjadi kesalahan yang tidak diketahui.';
const Store = {
  mode: 'loading', db: null, pending: 0,
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') { try { db = await window.claude.use('db'); } catch (e) { db = null; } }
    if (db) {
      this.db = db; this.mode = 'cloud';
      for (const mod of Object.keys(MODS)) {
        db.collection(MODS[mod].col).onSnapshot(
          snap => { setData(mod, snap.docs.map(d => ({ ...d.data(), id: d.id }))); this.pending = snap.metadata.hasPendingWrites ? 1 : 0; updateSync(); },
          err => { toast('error', 'Sinkronisasi terputus', errMsg(err)); }
        );
      }
    } else {
      this.mode = 'local';
      for (const mod of Object.keys(MODS)) setData(mod, this.readLocal(mod));
    }
    updateSync();
  },
  readLocal(mod) { try { return JSON.parse(localStorage.getItem('dataunit:' + MODS[mod].col) || '[]'); } catch (e) { return []; } },
  writeLocal(mod) {
    try { localStorage.setItem('dataunit:' + MODS[mod].col, JSON.stringify(state.data[mod].map(r => clean(r, mod)))); }
    catch (e) { throw { code: 'local_quota' }; }
  },
  async retry(fn) {
    try { return await fn(); }
    catch (e) { if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); return fn(); } throw e; }
  },
  upsertMem(mod, rec) {
    const arr = state.data[mod], i = arr.findIndex(r => r.id === rec.id);
    const p = prepare(mod, { ...rec });
    if (i >= 0) arr[i] = p; else arr.push(p);
    state.version++; $('#cnt-' + mod).textContent = fmtNum(arr.length);
  },
  async save(mod, rec) {
    if (this.mode === 'cloud') {
      await this.retry(() => this.db.collection(MODS[mod].col).doc(rec.id).set(clean(rec, mod)));
      this.upsertMem(mod, rec);
    } else {
      const backup = state.data[mod].slice();
      this.upsertMem(mod, rec);
      try { this.writeLocal(mod); } catch (e) { state.data[mod] = backup; state.version++; throw e; }
    }
    scheduleRender();
  },
  async saveMany(mod, recs, onProgress) {
    if (this.mode !== 'cloud') {
      const backup = state.data[mod].slice();
      recs.forEach(r => this.upsertMem(mod, r));
      try { this.writeLocal(mod); } catch (e) { state.data[mod] = backup; state.version++; throw e; }
      onProgress(recs.length); scheduleRender(); return recs.length;
    }
    let done = 0, i = 0; const col = this.db.collection(MODS[mod].col);
    const worker = async () => {
      while (i < recs.length) {
        const r = recs[i++];
        try { await this.retry(() => col.doc(r.id).set(clean(r, mod))); }
        catch (e) { if (e?.code === 'resource_exhausted') { await new Promise(res => setTimeout(res, 2500)); await col.doc(r.id).set(clean(r, mod)); } else throw e; }
        done++; onProgress(done);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    return done;
  },
  async remove(mod, id) {
    if (this.mode === 'cloud') await this.retry(() => this.db.collection(MODS[mod].col).doc(id).delete());
    const backup = state.data[mod].slice();
    state.data[mod] = state.data[mod].filter(r => r.id !== id); state.version++;
    if (this.mode !== 'cloud') { try { this.writeLocal(mod); } catch (e) { state.data[mod] = backup; throw e; } }
    $('#cnt-' + mod).textContent = fmtNum(state.data[mod].length);
    scheduleRender();
  },
  async refresh(mod) {
    if (this.mode === 'cloud') { const snap = await this.retry(() => this.db.collection(MODS[mod].col).get()); setData(mod, snap.docs.map(d => ({ ...d.data(), id: d.id }))); }
    else setData(mod, this.readLocal(mod));
  }
};
function clean(rec, mod) {
  const m = MODS[mod];
  const out = { id: rec.id, createdAt: rec.createdAt || null, updatedAt: rec.updatedAt || null };
  for (const f of m.fields) out[f.k] = has(rec[f.k]) ? rec[f.k] : null;
  return out;
}
function updateSync() {
  const el = $('#sync'), tx = $('#syncText');
  if (Store.mode === 'cloud') {
    el.dataset.s = Store.pending ? 'syncing' : 'cloud';
    tx.innerHTML = Store.pending ? '<b>Menyinkronkan…</b>Perubahan sedang dikirim' : '<b>Tersimpan di cloud</b>Data aman meski browser ditutup, dan sama di semua perangkat';
  } else if (Store.mode === 'local') {
    el.dataset.s = 'local'; tx.innerHTML = '<b>Tersimpan di browser ini</b>Data tetap ada setelah browser ditutup. Export Excel secara berkala sebagai cadangan.';
  }
}

/* ---------- filtering / sorting ---------- */
let viewCache = { key: '', rows: [] };
function getView() {
  const m = M(), u = U();
  const key = [state.mod, state.version, u.q, JSON.stringify(u.f), u.sort.k, u.sort.dir].join('|');
  if (viewCache.key === key) return viewCache.rows;
  let rows = state.data[state.mod];
  const q = u.q.trim().toLowerCase();
  if (q) { const terms = q.split(/\s+/); rows = rows.filter(r => terms.every(t => r._s.includes(t))); }
  for (const [k, v] of Object.entries(u.f)) {
    if (!v) continue;
    if (k === '_periode') rows = rows.filter(r => (r[m.dateKey] || '').slice(0, 7) === v);
    else if (v === '__empty') rows = rows.filter(r => !has(r[k]));
    else rows = rows.filter(r => r[k] === v);
  }
  const { k, dir } = u.sort, f = m.byKey[k], mul = dir === 'asc' ? 1 : -1;
  const num = f && NUMERIC.has(f.t);
  rows = rows.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (!has(x) && !has(y)) return 0; if (!has(x)) return 1; if (!has(y)) return -1;
    if (num) return (x - y) * mul;
    return String(x).localeCompare(String(y), 'id', { sensitivity: 'base' }) * mul;
  });
  viewCache = { key, rows };
  return rows;
}

/* ---------- rendering ---------- */
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

function cellValue(f, r, table) {
  const v = r[f.k];
  if (!has(v)) return '';
  if (f.k === 'status') return `<span class="badge ${v === 'Terjual' ? 'terjual' : 'stok'}">${v}</span>`;
  if (f.t === 'money') return fmtRp(v);
  if (f.t === 'date') return table ? fmtDate(v) : fmtDateLong(v);
  if (f.t === 'int') return fmtNum(v) + (f.suf ? ' ' + f.suf : '');
  return esc(v);
}

function renderChrome() {
  const m = M(), u = U();

  $('#q').value = u.q;
  // filter selects
  const all = state.data[state.mod];
  $('#filters').innerHTML = m.filters.map(fl => {
    let opts;
    if (fl.k === '_periode') {
      const set = [...new Set(all.map(r => (r[m.dateKey] || '').slice(0, 7)).filter(Boolean))].sort().reverse();
      opts = set.map(v => [v, new Date(v + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })]);
    } else if (fl.fixed) opts = fl.fixed.map(v => [v, v]);
    else {
      const vals = [...new Set(all.map(r => r[fl.k]).filter(has))].sort((a, b) => a.localeCompare(b, 'id'));
      opts = vals.map(v => [v, v]);
      if (fl.empty && all.some(r => !has(r[fl.k]))) opts.push(['__empty', fl.empty]);
    }
    const cur = u.f[fl.k] || '';
    if (cur && !opts.some(o => o[0] === cur)) opts.unshift([cur, cur === '__empty' ? (fl.empty || 'Tidak diisi') : cur]);
    return `<select data-filter="${fl.k}" aria-label="${esc(fl.all)}"><option value="">${esc(fl.all)}</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }).join('');
  // sort select
  const nm = m.byKey[m.nameKey].l;
  const sorts = [[m.dateKey, 'desc', 'Tanggal terbaru'], [m.dateKey, 'asc', 'Tanggal terlama'], [m.nameKey, 'asc', nm + ' A–Z'], [m.nameKey, 'desc', nm + ' Z–A'],
    [m.valueKey, 'desc', 'Nilai ' + m.valueLabel + ' tertinggi'], [m.valueKey, 'asc', 'Nilai ' + m.valueLabel + ' terendah']];
  const curS = u.sort.k + ':' + u.sort.dir; const match = sorts.some(s => s[0] + ':' + s[1] === curS);
  $('#sort').innerHTML = (match ? '' : `<option value="${curS}" selected>Urut: ${esc(m.byKey[u.sort.k].l)} (${u.sort.dir === 'asc' ? 'naik' : 'turun'})</option>`) +
    sorts.map(s => `<option value="${s[0]}:${s[1]}"${s[0] + ':' + s[1] === curS ? ' selected' : ''}>${esc(s[2])}</option>`).join('');
  // table head
  $('#thead').innerHTML = '<tr><th class="r">No.</th>' + m.table.map(k => {

function render() {

  }

  for (let p = 1; p <= pages; p++) { if (p === 1 || p === pages || Math.abs(p - u.page) <= 1) add(p); else if (nums[nums.length - 1] !== '…') add('…'); }
  $('#pager').innerHTML = `<span class="meta">Menampilkan <b>${fmtNum(start + 1)}–${fmtNum(start + slice.length)}</b> dari ${fmtNum(rows.length)}</span>

    ${nums.map(n => n === '…' ? '<span class="gap">…</span>' : `<button class="btn" data-page="${n}" aria-current="${n === u.page}">${n}</button>`).join('')}

}

function readForm(validate) {

    else v = raw ? (f.upper ? raw.toUpperCase() : raw) : null;
    rec[f.k] = v;

    if (!has(v)) continue;
    if (f.t === 'phone' && !/^\+?\d{9,15}$/.test(v)) E[f.k] = 'Nomor harus 9–15 digit angka (boleh diawali +).';
    if (f.t === 'nik' && !/^\d{16}$/.test(v)) E[f.k] = `NIK harus tepat 16 digit angka (sekarang ${v.replace(/\D/g, '').length} digit).`;
    if (f.t === 'year' && (v < 1970 || v > yNow + 1)) E[f.k] = `Tahun harus antara 1970 dan ${yNow + 1}.`;
    if (f.t === 'int' && (v < (f.min ?? 0) || v > (f.max ?? 1e9))) E[f.k] = `${f.l} harus antara ${f.min} dan ${f.max} ${f.suf || ''}.`;
    if (f.t === 'money' && v > 1e13) E[f.k] = 'Nilai terlalu besar.';
    if (f.t === 'date' && isNaN(new Date(v + 'T00:00:00'))) E[f.k] = 'Format tanggal tidak valid.';
    if (f.t === 'date' && f.past && v > todayISO()) E[f.k] = `${f.l} tidak boleh di masa depan.`;

function recompute() {

function reformat(el, fmt) {
  const pos = el.selectionStart ?? el.value.length, raw = el.value;
  const after = raw.slice(pos).replace(/\D/g, '').length;
  const nv = fmt(raw); el.value = nv;
  let p = nv.length, c = 0; while (p > 0 && c < after) { p--; if (/\d/.test(nv[p])) c++; }
  try { el.setSelectionRange(p, p); } catch (e) {}
}

$('#form').addEventListener('input', e => {
  const el = e.target, t = el.dataset.t; if (!t) return;
  const k = el.name; let bad = false;
  if (t === 'money') { bad = /[^\d.\s]/.test(el.value); reformat(el, r => { const d = r.replace(/\D/g, '').replace(/^0+(?=\d)/, ''); return d ? Number(d).toLocaleString('id-ID') : ''; }); }
  else if (t === 'int' || t === 'year' || t === 'nik') { bad = /\D/.test(el.value); reformat(el, r => r.replace(/\D/g, '')); }
  else if (t === 'phone') { bad = /[^\d+\s-]/.test(el.value); reformat(el, r => { const plus = r.trim().startsWith('+'); return (plus ? '+' : '') + r.replace(/\D/g, ''); }); }

/* ---------- export / import ---------- */
const libs = {};
function loadScript(src) { return libs[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete libs[src]; rej(new Error('Gagal memuat pustaka export. Periksa koneksi internet.')); }; document.head.appendChild(s); }); }
const loadXLSX = () => loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
const loadPDF = async () => { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'); };
let dlPromise = null;
const getDownloads = () => dlPromise ||= (window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null));

async function deliver(filename, blob, count) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('success', 'File diekspor', `${filename} · ${fmtNum(count)} data`); }
    catch (e) { if (e?.code === 'declined') toast('info', 'Export dibatalkan'); else toast('error', 'Export gagal', e?.message || 'Coba lagi.'); }
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('success', 'File diekspor', `${filename} · ${fmtNum(count)} data`);
  }
}
function filterDesc() {
  const m = M(), u = U(), parts = [];
  if (u.q.trim()) parts.push(`pencarian "${u.q.trim()}"`);
  for (const fl of m.filters) { const v = u.f[fl.k]; if (!v) continue;
    const lab = fl.k === '_periode' ? new Date(v + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) : v === '__empty' ? fl.empty : v;
    parts.push(lab); }
  return parts.length ? 'Filter: ' + parts.join(', ') : 'Semua data';
}
const excelSerial = iso => { const [y, mo, d] = iso.split('-').map(Number); return (Date.UTC(y, mo - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
function exportFields(m) { return m.order.map(k => m.byKey[k]); }
const fileBase = () => `${M().title.toLowerCase().replace(/\s+/g, '-')}_${todayISO()}`;

async function doExport(kind) {
  const m = M(), rows = getView(); if (!rows.length) return;
  const t = toast('loading', `Menyiapkan file ${kind.toUpperCase()}…`, `${fmtNum(rows.length)} data sesuai filter`);
  try {
    if (kind === 'csv') {
      const F = exportFields(m); const q = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const lines = [[m.noHeader, ...F.map(f => f.h)].map(q).join(';')];
      rows.forEach((r, i) => lines.push([i + 1, ...F.map(f => has(r[f.k]) ? r[f.k] : '')].map(q).join(';')));
      t.close(); await deliver(fileBase() + '.csv', new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' }), rows.length);
    } else if (kind === 'xlsx') {
      await loadXLSX();
      const F = exportFields(m);
      const aoa = [[m.noHeader, ...F.map(f => f.h)], ...rows.map((r, i) => [i + 1, ...F.map(f => !has(r[f.k]) ? null : f.t === 'date' ? excelSerial(r[f.k]) : r[f.k])])];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      F.forEach((f, ci) => { if (f.t !== 'date' && f.t !== 'money') return;
        for (let ri = 1; ri < aoa.length; ri++) { const c = ws[XLSX.utils.encode_cell({ r: ri, c: ci + 1 })]; if (c) c.z = f.t === 'date' ? 'dd mmmm yyyy' : '#,##0;-#,##0'; } });
      ws['!cols'] = [{ wch: 5 }, ...F.map(f => ({ wch: f.t === 'area' ? 32 : f.t === 'date' ? 16 : f.t === 'money' ? 14 : Math.max(10, f.h.length + 2) }))];
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: F.length } }) };
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, m.sheet);
      const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      t.close(); await deliver(fileBase() + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), rows.length);
    } else {

      const F = m.pdf.map(k => m.byKey[k]);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(15, 31, 61); doc.text('Laporan ' + m.title, 36, 40);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(94, 106, 127);
      doc.text(`${filterDesc()} — ${fmtNum(rows.length)} data — dicetak ${new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' })}`, 36, 56);
      const sum = m.summary(rows).map(s => s[0] + ': ' + s[1]).join('     '); doc.text(sum, 36, 70);
      const plain = (f, r) => { const v = r[f.k]; if (!has(v)) return '-'; if (f.t === 'money') return fmtNum(v); if (f.t === 'date') return fmtDate(v); return String(v); };
      doc.autoTable({
        startY: 82, head: [['No', ...F.map(f => f.l + (f.t === 'money' ? ' (Rp)' : ''))]],
        body: rows.map((r, i) => [i + 1, ...F.map(f => plain(f, r))]),
        styles: { fontSize: 7.5, cellPadding: 4, textColor: [22, 33, 58], lineColor: [225, 229, 236], lineWidth: .5 },
        headStyles: { fillColor: [15, 31, 61], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [247, 248, 251] },
        columnStyles: Object.fromEntries(F.map((f, i) => [i + 1, NUMERIC.has(f.t) ? { halign: 'right' } : {}])),
        margin: { left: 36, right: 36 },
        didDrawPage: d => { doc.setFontSize(8); doc.setTextColor(140); doc.text(`Halaman ${doc.internal.getNumberOfPages()}`, doc.internal.pageSize.getWidth() - 36, doc.internal.pageSize.getHeight() - 18, { align: 'right' }); }
      });
      const blob = doc.output('blob'); t.close(); await deliver(fileBase() + '.pdf', blob, rows.length);
    }
  } catch (e) { t.update('error', 'Export gagal', e?.message || 'Coba lagi.'); }
}

const normH = h => String(h ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
function parseCell(f, v) {
  if (v === null || v === undefined || v === '') return null;
  if (f.t === 'date') {
    if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600e3); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return d.toISOString().slice(0, 10); }
    const s = String(v).trim(), a = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (a) return `${a[3]}-${a[2].padStart(2, '0')}-${a[1].padStart(2, '0')}`;
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : null;
  }
  if (NUMERIC.has(f.t)) { if (typeof v === 'number') return Math.round(v); const d = String(v).replace(/[^\d-]/g, ''); return d && d !== '-' ? Number(d) : null; }
  const s = String(v).trim(); return s ? (f.upper ? s.toUpperCase() : s) : null;
}
async function importExcel(file) {
  const m = M(); const t = toast('loading', 'Membaca file…', file.name);
  try {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const want = new Map(m.fields.filter(f => !f.calc).map(f => [normH(f.h), f]));
    let found = null;
    for (const name of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
      for (let i = 0; i < Math.min(12, rows.length); i++) {
        const map = (rows[i] || []).map(h => want.get(normH(h)) || null);
        if (map.filter(Boolean).length >= 5) { found = { name, rows, i, map }; break; }
      }
      if (found) break;
    }
    if (!found) { t.update('error', 'Kolom tidak dikenali', `File ini tidak memuat judul kolom ${m.title.toLowerCase()} seperti di template (mis. "${m.fields[1].h}", "${m.fields[3].h}").`); return; }
    const now = new Date().toISOString(); const recs = [];
    for (const row of found.rows.slice(found.i + 1)) {
      if (!row) continue; const rec = {}; let any = false;
      found.map.forEach((f, ci) => { if (!f) return; const v = parseCell(f, row[ci]); if (has(v)) any = true; rec[f.k] = v; });
      if (!any) continue;
      m.compute(rec); rec.id = newId(); rec.createdAt = rec.updatedAt = now; recs.push(rec);
    }
    t.close();
    if (!recs.length) { toast('info', 'Tidak ada baris data', `Sheet "${found.name}" hanya berisi judul kolom.`); return; }
    const ok = await confirmDialog({ title: `Import ${fmtNum(recs.length)} data?`, body: `${fmtNum(recs.length)} baris dari sheet "${found.name}" akan ditambahkan ke ${m.title.toLowerCase()}. Data yang sudah ada tidak diubah.`, ok: 'Import data' });
    if (!ok) return;
    const p = toast('loading', 'Mengimpor data…', `0 dari ${fmtNum(recs.length)}`);
    const upd = debounce(n => p.update('loading', 'Mengimpor data…', `${fmtNum(n)} dari ${fmtNum(recs.length)}`), 100);
    const n = await Store.saveMany(state.mod, recs, upd);
    setTimeout(() => p.update('success', 'Import selesai', `${fmtNum(n)} data ditambahkan`), 150);
  } catch (e) { t.update('error', 'Import gagal', errMsg(e)); }
}

/* ---------- events ---------- */
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => { state.mod = b.dataset.mod; viewCache.key = ''; render(); }));
$('#btnAdd').addEventListener('click', () => openForm());
$('#q').addEventListener('input', debounce(e => { U().q = e.target.value; U().page = 1; render(); }, 180));
$('#filters').addEventListener('change', e => { const k = e.target.dataset.filter; if (!k) return; U().f[k] = e.target.value; U().page = 1; render(); });
$('#sort').addEventListener('change', e => { const [k, dir] = e.target.value.split(':'); U().sort = { k, dir }; U().page = 1; render(); });
$('#thead').addEventListener('click', e => { const b = e.target.closest('[data-sort]'); if (!b) return; const u = U(), k = b.dataset.sort;
  u.sort = { k, dir: u.sort.k === k && u.sort.dir === 'asc' ? 'desc' : (u.sort.k === k ? 'asc' : (NUMERIC.has(M().byKey[k].t) || M().byKey[k].t === 'date' ? 'desc' : 'asc')) }; u.page = 1; render(); });
const resetFilters = () => { const u = U(); u.q = ''; u.f = {}; u.page = 1; render(); };
$('#btnReset').addEventListener('click', resetFilters);
$('#btnRefresh').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true; const old = b.innerHTML; b.innerHTML = '<span class="spin"></span>Memuat…';
  try { await Store.refresh(state.mod); toast('success', 'Data dimuat ulang', `${fmtNum(state.data[state.mod].length)} data ${M().title.toLowerCase()}`); }
  catch (err) { toast('error', 'Gagal memuat ulang', errMsg(err)); }
  finally { b.disabled = false; b.innerHTML = old; }
});
$('#btnImport').addEventListener('click', () => { $('#file').value = ''; $('#file').click(); });
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importExcel(f); });
document.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', () => doExport(b.dataset.export)));
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) { e.stopPropagation(); const id = act.closest('tr')?.dataset.id; const a = act.dataset.act;
    if (a === 'add') openForm(); else if (a === 'reset') resetFilters();
    else if (a === 'view') openDetail(id); else if (a === 'edit') openForm(state.data[state.mod].find(r => r.id === id)); else if (a === 'del') deleteRec(id);
    return; }
  const tr = e.target.closest('#tbody tr[data-id]'); if (tr) openDetail(tr.dataset.id);
  const pg = e.target.closest('[data-page]'); if (pg && !pg.disabled) { U().page = +pg.dataset.page; render(); $('.tablewrap').scrollTop = 0; }
});
document.addEventListener('change', e => { if (e.target.id === 'pageSize') { U().size = +e.target.value; U().page = 1; render(); } });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeForm));
document.querySelectorAll('[data-mclose]').forEach(b => b.addEventListener('click', closeDetail));
$('#btnSave').addEventListener('click', submitForm);
$('#mEdit').addEventListener('click', () => { const r = state.data[state.mod].find(x => x.id === state.detailId); closeDetail(); if (r) openForm(r); });
$('#mDel').addEventListener('click', () => deleteRec(state.detailId));
$('#scrim').addEventListener('click', () => { if ($('#confirm').classList.contains('open')) return; if ($('#detail').classList.contains('open')) closeDetail(); else closeForm(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#confirm').classList.contains('open')) $('#cNo').click(); else if ($('#detail').classList.contains('open')) closeDetail(); else if ($('#drawer').classList.contains('open')) closeForm(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && $('#drawer').classList.contains('open')) { e.preventDefault(); submitForm(); }
});

render();
getDownloads();
Store.init();
</script>
